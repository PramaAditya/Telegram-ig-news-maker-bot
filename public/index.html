<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Dashboard - IG News Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
  <style>
    [v-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-6">
  <div id="app" v-cloak class="max-w-6xl mx-auto bg-white p-8 rounded-lg shadow">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Queue Dashboard</h1>
      <div v-if="!apiKey" class="flex gap-2">
        <input v-model="tempKey" type="password" placeholder="Enter Dashboard Password" class="border p-2 rounded" @keyup.enter="saveKey">
        <button @click="saveKey" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Login</button>
      </div>
      <button v-else @click="logout" class="text-red-500 hover:underline">Logout</button>
    </div>

    <div v-if="apiKey">
      <div class="mb-4 flex justify-between items-center">
        <p class="text-sm text-gray-500">Showing all queue items. Trigger publication via API/N8N.</p>
        <button @click="fetchQueue" class="text-blue-500 hover:underline">Refresh</button>
      </div>

      <div v-if="loading" class="text-center py-10">Loading...</div>
      
      <div v-else class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b">
              <th class="p-3 w-16 text-center">Order</th>
              <th class="p-3">Slides</th>
              <th class="p-3 w-1/2">Caption</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(item, index) in queue" :key="item.id" class="border-b hover:bg-gray-50">
              <td class="p-3 text-center align-middle">
                <div class="flex flex-col items-center text-xl space-y-1">
                  <button v-if="index > 0" @click="moveItem(item.id, 'top')" class="text-blue-500 hover:text-blue-700 leading-none" title="Move to Top">⇈</button>
                  <button v-if="index > 0" @click="moveItem(item.id, 'up')" class="text-gray-400 hover:text-gray-700 leading-none" title="Move Up">▲</button>
                  <span class="text-sm font-bold text-gray-700 my-1">{{ index + 1 }}</span>
                  <button v-if="index < queue.length - 1" @click="moveItem(item.id, 'down')" class="text-gray-400 hover:text-gray-700 leading-none" title="Move Down">▼</button>
                </div>
              </td>
              <td class="p-3">
                <div class="flex flex-wrap gap-2 w-48">
                  <a v-for="(media, mIndex) in item.media" :key="mIndex" :href="media.url" class="glightbox" :data-gallery="'gallery-' + item.id">
                    <img v-if="media.type === 'image'" :src="media.url" class="w-12 h-12 object-cover rounded shadow hover:opacity-80 transition cursor-zoom-in">
                    <video v-else-if="media.type === 'video'" :src="media.url" class="w-12 h-12 object-cover rounded shadow hover:opacity-80 transition cursor-zoom-in" muted></video>
                  </a>
                  <div v-if="!item.media || item.media.length === 0" class="w-12 h-12 bg-gray-200 rounded flex items-center justify-center text-xs text-gray-400">None</div>
                </div>
              </td>
              <td class="p-3 text-sm">
                <div v-if="editingId === item.id">
                  <textarea v-model="editForm.text" class="w-full border p-2 rounded" rows="4"></textarea>
                </div>
                <div v-else class="whitespace-pre-wrap max-h-32 overflow-y-auto">{{ item.text }}</div>
              </td>
              <td class="p-3 text-right space-x-2 whitespace-nowrap">
                <div v-if="editingId === item.id">
                  <button @click="saveEdit" class="text-green-600 hover:underline">Save</button>
                  <button @click="cancelEdit" class="text-gray-500 hover:underline ml-2">Cancel</button>
                </div>
                <div v-else>
                  <button @click="startEdit(item)" class="text-blue-600 hover:underline">Edit</button>
                  <button @click="publishNow(item.id)" class="text-purple-600 hover:underline ml-2 font-semibold">Publish Now</button>
                  <button @click="deleteItem(item.id)" class="text-red-600 hover:underline ml-2">Delete</button>
                </div>
              </td>
            </tr>
            <tr v-if="queue.length === 0">
              <td colspan="4" class="p-6 text-center text-gray-500">No items in the queue.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
  <script>
    const { createApp, ref, onMounted, nextTick } = Vue;

    let lightbox = null;

    createApp({
      setup() {
        const queue = ref([]);
        const loading = ref(false);
        const apiKey = ref(localStorage.getItem('DASHBOARD_PASSWORD') || '');
        const tempKey = ref('');
        const editingId = ref(null);
        const editForm = ref({ text: '' });

        const saveKey = () => {
          if (!tempKey.value) return;
          apiKey.value = tempKey.value;
          localStorage.setItem('DASHBOARD_PASSWORD', apiKey.value);
          tempKey.value = '';
          fetchQueue();
        };

        const logout = () => {
          apiKey.value = '';
          localStorage.removeItem('DASHBOARD_PASSWORD');
          queue.value = [];
        };

        const apiCall = async (url, options = {}) => {
          const res = await fetch(url, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey.value}`,
              ...options.headers
            }
          });
          if (res.status === 401) {
            alert('Unauthorized. Invalid Password.');
            logout();
            throw new Error('Unauthorized');
          }
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            alert(`Error: ${data.error || res.statusText}`);
            throw new Error(data.error);
          }
          return res.json();
        };

        const fetchQueue = async () => {
          if (!apiKey.value) return;
          loading.value = true;
          try {
            queue.value = await apiCall('/api/queue');
            nextTick(() => {
              if (lightbox) {
                lightbox.reload();
              } else {
                lightbox = GLightbox({ selector: '.glightbox' });
              }
            });
          } catch (e) {
            console.error(e);
          } finally {
            loading.value = false;
          }
        };

        const deleteItem = async (id) => {
          if (!confirm('Are you sure you want to delete this post?')) return;
          try {
            await apiCall(`/api/queue/${id}`, { method: 'DELETE' });
            await fetchQueue();
          } catch (e) {}
        };

        const publishNow = async (id) => {
          if (!confirm('Are you sure you want to publish this to Buffer right now?')) return;
          loading.value = true;
          try {
            await apiCall(`/api/queue/${id}/publish`, { method: 'POST' });
            await fetchQueue();
            alert('Published successfully!');
          } catch (e) {
            loading.value = false;
          }
        };

        const moveItem = async (id, direction) => {
          try {
            // Optimistic UI update could be added here, but re-fetching is safer
            await apiCall(`/api/queue/${id}/move`, {
              method: 'POST',
              body: JSON.stringify({ direction })
            });
            await fetchQueue();
          } catch (e) {}
        };

        const startEdit = (item) => {
          editingId.value = item.id;
          editForm.value.text = item.text;
        };

        const cancelEdit = () => {
          editingId.value = null;
        };

        const saveEdit = async () => {
          try {
            await apiCall(`/api/queue/${editingId.value}`, {
              method: 'PUT',
              body: JSON.stringify({ text: editForm.value.text })
            });
            editingId.value = null;
            await fetchQueue();
          } catch (e) {}
        };

        onMounted(() => {
          if (apiKey.value) fetchQueue();
        });

        return {
          queue, loading, apiKey, tempKey, saveKey, logout, fetchQueue,
          deleteItem, publishNow, moveItem, editingId, editForm, startEdit, cancelEdit, saveEdit
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
