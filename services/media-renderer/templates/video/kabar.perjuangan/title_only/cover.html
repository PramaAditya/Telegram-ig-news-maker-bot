<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title Only Video Overlay</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: transparent;
        overflow: hidden;
        position: relative;
      }

      .title-box {
        position: absolute;
        bottom: 250px;
        left: 70px;
        right: 70px;
        height: 750px;
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        box-sizing: border-box;
      }

      .title {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        color: #000;
        text-align: center;
        width: 100%;
        height: 100%;
        text-transform: uppercase;
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <div class="title-box">
      <div id="title-text" class="title">{{{title}}}</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/textfit/2.4.0/textFit.min.js"></script>
    <script>
      window.onload = function() {
        textFit(document.getElementById('title-text'), {
          alignHoriz: true,
          alignVert: true,
          multiLine: true,
          maxFontSize: 120
        });
      };
    </script>
  </body>
</html>
