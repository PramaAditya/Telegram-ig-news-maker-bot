<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 60px;
    }

    .title {
      font-family: "Montserrat", sans-serif;
      font-weight: 800;
      color: #FFFFFF;
      text-align: center;
      width: 100%;
      height: 100%;
      text-transform: uppercase;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="title-text" class="title">{{{title}}}</div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/textfit/2.4.0/textFit.min.js"></script>
  <script>
    window.onload = function() {
      textFit(document.getElementById('title-text'), {
        alignHoriz: true,
        alignVert: true,
        multiLine: true,
        maxFontSize: 120
      });
    };
  </script>
</body>
</html>
