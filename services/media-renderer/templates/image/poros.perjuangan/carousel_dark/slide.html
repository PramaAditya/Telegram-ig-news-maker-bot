<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Slide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1350px;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #d1d5db;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1080px;
            object-fit: contain;
            object-position: center;
            filter: grayscale(100%);
            opacity: 0.15;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: 60px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3;
        }

        .logo {
            max-width: 250px;
            max-height: 80px;
            object-fit: contain;
        }

        .content {
            width: 860px;
            height: 900px;
            font-size: 42px;
            line-height: 1.6;
            margin-top: 0;
            color: #d1d5db;
            z-index: 1;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .content p {
            margin: 0;
        }

        .content p:not(:last-child) {
            margin-bottom: 30px;
        }

        .content strong,
        .content b {
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>
<body>
    {{#if cover_image}}
    <img src="{{cover_image}}" class="cover-image" alt="Cover Image">
    {{/if}}
    <div class="top-bar">
      <img src="{{logo}}" class="logo" alt="Logo" />
    </div>
    
    <div class="content">
        {{{text}}}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/textfit/2.4.0/textFit.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            textFit(document.querySelectorAll('.content'), {
                multiLine: true,
                maxFontSize: 42,
                minFontSize: 24,
                alignVert: true,
                alignHoriz: false
            });
        });
    </script>
</body>
</html>
