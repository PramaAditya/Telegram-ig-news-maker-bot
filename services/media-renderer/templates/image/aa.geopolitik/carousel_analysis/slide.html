<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
  <title>Slide - AA Geopolitik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Bebas+Neue&family=Chivo+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1350px;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .font-bebas {
      font-family: 'Bebas Neue', sans-serif;
    }
    .font-alumni {
      font-family: 'Alumni Sans', sans-serif;
    }
    .font-chivo {
      font-family: 'Chivo Mono', monospace;
    }
    .slide-gradient {
      background: linear-gradient(to top, #000000 0%, #000000 39%, rgba(0, 0, 0, 0) 100%);
    }
    .slide-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 96px;
      line-height: 0.93;
      color: #ffffff;
      text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.95);
    }
    .slide-title strong,
    .slide-title b,
    .slide-title .highlight {
      color: #f59e0b; /* text-amber-500 */
      font-weight: 400;
      font-style: normal;
    }
    .slide-body {
      font-family: 'Alumni Sans', sans-serif;
      font-size: 60px;
      line-height: 1.15;
      color: #ffffff;
    }
    .slide-body strong,
    .slide-body b {
      font-weight: 600;
      color: #ffffff;
    }
    .slide-body p {
      margin: 0;
    }
    .slide-body p:not(:last-child) {
      margin-bottom: 10px;
    }
    .slide-body br {
      display: block;
      content: "";
      margin-top: 10px;
    }
    .slide-body br + br {
      display: none;
    }
    .logo-container {
      position: absolute;
      top: 60px;
      left: 73px;
      z-index: 10;
    }
    .logo {
      max-height: 60px;
      max-width: 240px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="w-[1080px] h-[1350px] relative bg-black overflow-hidden">
    {{#if logo}}
    <div class="logo-container">
      <img src="{{logo}}" class="logo" alt="Logo" />
    </div>
    {{/if}}


    <img 
      class="w-[1080px] h-[1350px] left-0 top-[-174px] absolute object-cover" 
      style="opacity: 0.15;"
      src="{{#if slide_image}}{{slide_image}}{{else if cover_image}}{{cover_image}}{{else}}https://placehold.co/1080x1350{{/if}}" 
      alt="Slide Background" 
    />

    <div class="w-[1080px] h-[810px] left-0 top-[540px] absolute slide-gradient"></div>

    <div id="slideContent" class="w-[934px] h-[700px] left-[73px] top-[569px] absolute flex flex-col justify-start items-start gap-5">
      {{#if title}}
      <div id="slideTitle" class="self-stretch justify-start slide-title shrink-0">
        {{{title}}}
      </div>
      {{/if}}

      <div id="slideBodyWrapper" class="self-stretch flex-1 min-h-0 w-full relative overflow-hidden">
        <div id="slideBody" class="w-full slide-body">
          {{{text}}}
        </div>
      </div>
    </div>
  </div>

  <script>
    function binarySearchFontSize(el, maxWidth, maxHeight, minSize, maxSize, lineHeightRatio) {
      let low = minSize;
      let high = maxSize;
      let best = minSize;

      while (high - low >= 0.5) {
        const mid = (low + high) / 2;
        el.style.fontSize = mid + 'px';
        if (lineHeightRatio) {
          el.style.lineHeight = String(lineHeightRatio);
        }
        if (el.scrollHeight <= maxHeight && el.scrollWidth <= maxWidth) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      el.style.fontSize = best.toFixed(1) + 'px';
      return best;
    }

    function fitText() {
      const container = document.getElementById('slideContent');
      const title = document.getElementById('slideTitle');
      const bodyWrapper = document.getElementById('slideBodyWrapper');
      const body = document.getElementById('slideBody');
      if (!container || !body || !bodyWrapper) return;

      const maxWidth = container.clientWidth;
      const totalBoundaryHeight = container.clientHeight; // 700px

      // 1. Fit Title within max 2 lines (~185px height) between [64px, 104px]
      if (title) {
        binarySearchFontSize(title, maxWidth, 185, 64, 104, 0.93);
      }

      // 2. Calculate remaining boundary height for Body and fill it to the max between [28px, 76px]
      const gap = 20; // gap-5 = 20px
      const titleHeight = title ? title.offsetHeight + gap : 0;
      const availableBodyHeight = Math.max(200, totalBoundaryHeight - titleHeight);
      bodyWrapper.style.height = availableBodyHeight + 'px';

      binarySearchFontSize(body, maxWidth, availableBodyHeight, 28, 76, 1.15);
    }

    window.addEventListener('DOMContentLoaded', fitText);
    window.addEventListener('load', fitText);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitText);
    }
  </script>
</body>
</html>
