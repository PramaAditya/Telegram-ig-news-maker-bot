<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
  <title>Cover - AA Geopolitik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Bebas+Neue&family=Chivo+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1350px;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .font-bebas {
      font-family: 'Bebas Neue', sans-serif;
    }
    .font-alumni {
      font-family: 'Alumni Sans', sans-serif;
    }
    .font-chivo {
      font-family: 'Chivo Mono', monospace;
    }
    .cover-gradient {
      background: linear-gradient(to top, #000000 0%, #000000 39%, rgba(0, 0, 0, 0) 100%);
    }
    .cover-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 128px;
      line-height: 0.94;
      color: #ffffff;
      text-shadow: 0px 0px 20px rgba(0, 0, 0, 1.0);
    }
    .cover-title strong,
    .cover-title b,
    .cover-title .highlight {
      color: #f59e0b; /* text-amber-500 */
      font-weight: 400;
      font-style: normal;
    }
    .cover-subtitle {
      font-family: 'Alumni Sans', sans-serif;
      font-size: 60px;
      line-height: 1.1;
      color: #ffffff;
    }
    .logo-container {
      position: absolute;
      top: 60px;
      left: 87px;
      z-index: 10;
    }
    .logo {
      max-height: 70px;
      max-width: 260px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="w-[1080px] h-[1350px] relative bg-black overflow-hidden">
    {{#if logo}}
    <div class="logo-container">
      <img src="{{logo}}" class="logo" alt="Logo" />
    </div>
    {{/if}}

    <img 
      class="w-[1080px] h-[1350px] left-0 top-[-63px] absolute object-cover" 
      src="{{#if cover_image}}{{cover_image}}{{else}}https://placehold.co/1080x1350{{/if}}" 
      alt="Cover Background" 
    />

    <div class="w-[1080px] h-[1042px] left-0 top-[308px] absolute cover-gradient"></div>

    <div id="coverContent" class="w-[906px] h-[640px] left-[87px] bottom-[80px] absolute flex flex-col justify-end items-start gap-3.5">
      <div class="self-stretch justify-end">
        <div id="coverTitle" class="cover-title">
          {{{title}}}
        </div>
      </div>

      {{#if subtitle}}
      <div id="coverSubtitle" class="self-stretch justify-start cover-subtitle">
        {{{subtitle}}}
      </div>
      {{/if}}

      <div id="coverFooter" class="self-stretch pt-3.5 inline-flex justify-start items-center gap-6 shrink-0">
        <div class="flex-1 h-[4px] bg-white"></div>
        <div class="justify-center text-orange-300 text-lg font-normal font-chivo tracking-wider">
          {{#if cta_text}}{{cta_text}}{{else}}Read More{{/if}}
        </div>
        <div class="flex items-center">
          <svg class="w-20 h-6" viewBox="0 0 80 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="2" y1="12" x2="62" y2="12" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M52 3L62 12L52 21" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M66 3L76 12L66 21" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    function binarySearchFontSize(el, maxWidth, maxHeight, minSize, maxSize, lineHeightRatio) {
      let low = minSize;
      let high = maxSize;
      let best = minSize;

      while (high - low >= 0.5) {
        const mid = (low + high) / 2;
        el.style.fontSize = mid + 'px';
        if (lineHeightRatio) {
          el.style.lineHeight = String(lineHeightRatio);
        }
        if (el.scrollHeight <= maxHeight && el.scrollWidth <= maxWidth) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      el.style.fontSize = best.toFixed(1) + 'px';
      return best;
    }

    function fitCoverText() {
      const container = document.getElementById('coverContent');
      const title = document.getElementById('coverTitle');
      const subtitle = document.getElementById('coverSubtitle');
      const footer = document.getElementById('coverFooter');
      if (!container || !title) return;

      const maxWidth = container.clientWidth;
      const totalHeight = container.clientHeight; // 640px
      const footerHeight = footer ? footer.offsetHeight + 14 : 50;

      // 1. Fit subtitle first if present (max 2-3 lines, up to 160px) between [38px, 60px]
      let subtitleHeight = 0;
      if (subtitle) {
        binarySearchFontSize(subtitle, maxWidth, 160, 38, 60, 1.1);
        subtitleHeight = subtitle.offsetHeight + 14;
      }

      // 2. Fit title into remaining height (max 380px) between [76px, 136px]
      const availableTitleHeight = Math.min(380, totalHeight - footerHeight - subtitleHeight);
      binarySearchFontSize(title, maxWidth, availableTitleHeight, 76, 136, 0.94);
    }

    window.addEventListener('DOMContentLoaded', fitCoverText);
    window.addEventListener('load', fitCoverText);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitCoverText);
    }
  </script>
</body>
</html>
