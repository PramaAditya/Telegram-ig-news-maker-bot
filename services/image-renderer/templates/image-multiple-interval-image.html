<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      background-color: #000;
      overflow: hidden;
    }
    .main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      object-fit: contain;
      opacity: 0.1;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img class="main-image" src="{{image_url}}" alt="Main Image">
  <img class="watermark" src="{{logo}}" alt="Watermark Logo">
</body>
</html>
