version: '3.8'

volumes:
  telegram-data:

services:
  botapi:
    image: aiogram/telegram-bot-api:latest
    container_name: botapi
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    ports:
      - "8081:8081"
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build: .
    container_name: ignews_bot
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_API_URL=http://botapi:8081
    command: npm run start:bot
    ports:
      - "3000:3000"
    depends_on:
      - botapi
    
  worker:
    build: .
    container_name: ignews_worker
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_API_URL=http://botapi:8081
    command: npm run start:worker
    depends_on:
      - botapi
