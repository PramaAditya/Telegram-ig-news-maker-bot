version: '3.8'

volumes:
  telegram-data:

services:
  ignews_botapi:
    image: aiogram/telegram-bot-api:latest
    container_name: ignews_botapi
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    # Removed host port mapping "8081:8081" to prevent conflict with your other project's API server.
    # The internal containers (bot and worker) can still access it on port 8081 via the Docker network.
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build: .
    container_name: ignews_bot
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_API_URL=http://ignews_botapi:8081
    command: npm run start:bot
    ports:
      - "3000:3000"
    depends_on:
      - ignews_botapi
    
  worker:
    build: .
    container_name: ignews_worker
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_API_URL=http://ignews_botapi:8081
    command: npm run start:worker
    depends_on:
      - ignews_botapi
