version: '3.8'

volumes:
  telegram-data:

services:
  ignews_botapi:
    image: aiogram/telegram-bot-api:latest
    container_name: ignews_botapi
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    # Removed host port mapping "8081:8081" to prevent conflict with your other project's API server.
    # The internal containers (bot and worker) can still access it on port 8081 via the Docker network.
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build: .
    container_name: ignews_bot
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_API_URL=http://ignews_botapi:8081
      - MEDIA_API_URL=http://media-renderer:3000
      - SUBTITLE_API_URL=http://subtitle-maker:3001
    command: npm run start:bot
    ports:
      - "3000:3000"
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    depends_on:
      - ignews_botapi
      - media-renderer
      - subtitle-maker
    
  media-renderer:
    build: ./services/media-renderer
    container_name: ignews_media_renderer
    restart: always
    env_file: .env
    expose:
      - "3000"

  subtitle-maker:
    build: ./services/subtitle-maker
    container_name: ignews_subtitle_maker
    restart: always
    env_file: .env
    expose:
      - "3001"

  worker:
    build: .
    container_name: ignews_worker
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_API_URL=http://ignews_botapi:8081
      - MEDIA_API_URL=http://media-renderer:3000
      - SUBTITLE_API_URL=http://subtitle-maker:3001
    command: npm run start:worker
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    depends_on:
      - ignews_botapi
      - media-renderer
      - subtitle-maker
